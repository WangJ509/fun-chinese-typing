<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注音打字稿紙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a manuscript sheet (稿紙) in the middle — target row, typed row graded in red ink — with tallies per input method beside it. */
:root {
  --paper: #f6f8f3;
  --sheet: #fdfefb;
  --ink: #1f2a26;
  --muted: #5d6b64;
  --grid: #8fb7a0;
  --grid-soft: #d5e6db;
  --red: #c8372d;
  --red-soft: #f6dcd8;
  --ok: #2f7a52;
  --line: #dde5df;
  --font-kai: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "STKaiti", serif;
  --font-ui: "Noto Sans TC", "PingFang TC", "Heiti TC", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --cell: clamp(34px, 6.2vw, 52px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121815; --sheet: #18201c; --ink: #e4ece7; --muted: #95a59c;
    --grid: #4d7a62; --grid-soft: #26352d; --red: #f07a6c; --red-soft: #3a2220;
    --ok: #79c99a; --line: #2a362f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121815; --sheet: #18201c; --ink: #e4ece7; --muted: #95a59c;
  --grid: #4d7a62; --grid-soft: #26352d; --red: #f07a6c; --red-soft: #3a2220;
  --ok: #79c99a; --line: #2a362f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--font-kai); font-weight: 700; font-size: 1.9rem; margin: 0; letter-spacing: .04em; text-wrap: balance; }
h1 small { font-family: var(--font-ui); font-weight: 400; font-size: .85rem; color: var(--muted); letter-spacing: 0; margin-inline-start: 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
label.ctl { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
select, input[type="text"], button { font: inherit; color: var(--ink); }
select { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { cursor: pointer; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
button:hover { border-color: var(--grid); }
button.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
button.danger { color: var(--red); border-color: var(--red); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.sheet { background: var(--sheet); border: 1px solid var(--grid-soft); border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: .8rem; color: var(--muted); }
.meta .tag { font-family: var(--font-num); letter-spacing: .03em; }
.meta .cat { border: 1px solid var(--grid); color: var(--ok); padding: 0 8px; border-radius: 999px; }
.legend { font-size: .72rem; letter-spacing: .12em; color: var(--muted); }
/* Each column pairs a character of the original (top) with what was typed (bottom); columns wrap together, so every line of the original sits right above the typed line. */
.grid { display: flex; flex-wrap: wrap; padding-left: 1.5px; max-width: 100%; }
/* Units never split: in prose a unit is a character with the punctuation after it, so no line starts with punctuation; in poems and tongue twisters it is a whole phrase, so long lines wrap only after punctuation. */
.unit { display: flex; margin-bottom: 12px; }
.br { flex-basis: 100%; height: 0; }
.col { display: flex; flex-direction: column; border: 1.5px solid var(--grid); margin-left: -1.5px; }
.cell { width: var(--cell); height: var(--cell); position: relative; display: flex; align-items: center; justify-content: center; font-family: var(--font-kai); font-size: calc(var(--cell) * .62); line-height: 1; }
.cell.typed { border-top: 1px dashed var(--grid); background: var(--paper); }
.cell.wrong { color: var(--red); }
.cell.wrong::after { content: ""; position: absolute; inset: 10%; border: 1.6px solid var(--red); border-radius: 50%; opacity: .75; }
.cell.missing { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--red-soft) 5px 7px); }
/* Readings of rare characters run down the right side of the character, as in textbooks. */
.cell.has-reading { justify-content: flex-start; padding-left: calc(var(--cell) * .06); font-size: calc(var(--cell) * .56); }
.no-readings .cell.has-reading { justify-content: center; padding-left: 0; font-size: calc(var(--cell) * .62); }
.no-readings .cell .reading { display: none; }
.cell .reading { position: absolute; top: 50%; right: calc(var(--cell) * .03); transform: translateY(-50%); writing-mode: vertical-rl; text-orientation: upright; font-family: var(--font-ui); font-size: max(8px, calc(var(--cell) * .21)); color: var(--ok); line-height: 1; letter-spacing: 0; white-space: nowrap; }
.cell .fix { position: absolute; top: 1px; right: 3px; font-size: calc(var(--cell) * .26); color: var(--red); font-family: var(--font-kai); }
.cell.ok { color: var(--ink); }

.inputrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
/* The real input is invisible and sits on the square where the next character goes, so typing happens in the bottom row and the candidate window opens there. */
.sheet { position: relative; }
#typing { position: absolute; z-index: 1; width: var(--cell); height: var(--cell); padding: 0; border: 0; outline: none; background: transparent; color: transparent; caret-color: transparent; font-family: var(--font-kai); font-size: calc(var(--cell) * .62); }
#pairs { cursor: text; }
.cell.composing { color: var(--muted); text-decoration: underline 1.5px var(--grid); text-underline-offset: 4px; }
.cell.caret::before { content: ""; position: absolute; left: 3px; top: 18%; bottom: 18%; width: 2px; background: var(--ink); opacity: 0; }
.sheet:focus-within .cell.caret::before { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .sheet:focus-within .cell.caret::before { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } }
.hint { font-size: .8rem; color: var(--muted); }
.verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; min-height: 1.6em; }
.stamp { font-family: var(--font-kai); font-size: 1.35rem; font-weight: 700; color: var(--red); transform: rotate(-4deg); border: 2px solid var(--red); padding: 0 10px; border-radius: 4px; }
.stamp.good { color: var(--ok); border-color: var(--ok); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

aside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2 { font-size: .78rem; letter-spacing: .14em; color: var(--muted); font-weight: 500; margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: .75rem; }
td.num { font-size: .82rem; }
.tablewrap { overflow-x: auto; }
.history { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .82rem; }
.hrow .out { font-family: var(--font-kai); font-size: 1rem; overflow-wrap: anywhere; }
.hrow .out.bad { color: var(--red); }
.hrow .sub { grid-column: 1 / -1; color: var(--muted); font-size: .72rem; }
.empty { color: var(--muted); font-size: .85rem; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .stamp { animation: stamp .18s ease-out; } @keyframes stamp { from { transform: rotate(-4deg) scale(1.3); opacity: 0; } } }
</style>

<div class="wrap">
  <header>
    <h1>注音打字稿紙<small>在稿紙上打詩詞、散文、繞口令，邊打邊批改</small></h1>
    <div class="controls">
      <label class="ctl" for="set">題目
        <select id="set"></select>
      </label>
      <label class="ctl" for="order">順序
        <select id="order"><option value="seq">依序</option><option value="rand">隨機</option></select>
      </label>
      <label class="ctl" for="readings"><input type="checkbox" id="readings"> 冷僻字注音</label>
    </div>
  </header>

  <div class="layout">
    <section class="sheet" id="sheet">
      <div class="meta"><span class="tag" id="sid"></span><span class="cat" id="scat"></span><span id="progress"></span><span id="alts"></span></div>
      <div class="legend">每格上面是原文，下面直接打字</div>
      <div class="grid" id="pairs"></div>
      <div class="verdict" id="verdict"><span class="hint">每次按 Enter 送出選字就會立刻批改；整句打完再按一次 Enter 交卷。Esc 跳過這題。</span></div>
      <input type="text" id="typing" autocomplete="off" spellcheck="false" aria-label="打字">
      <div class="inputrow">
        <button id="skip">跳過</button>
        <button class="primary" id="next">下一題</button>
      </div>
      <p class="hint">逐字比對原文，標點也算。字／分算的是送出的字數，時間從第一個按鍵開始算，到按 Enter 交卷為止。作答紀錄只存在這台電腦的瀏覽器裡。</p>
    </section>

    <aside>
      <div class="panel">
        <h2>成績</h2>
        <div class="tablewrap"><table id="stats"><thead><tr><th>題組</th><th>題數</th><th>整句</th><th>逐字</th><th>字／分</th></tr></thead><tbody></tbody></table></div>
      </div>
      <div class="panel">
        <h2>最近作答</h2>
        <div class="history" id="history"></div>
        <div class="btnrow"><button class="danger" id="clear">清除所有紀錄</button></div>
      </div>
    </aside>
  </div>
</div>

<script>
const TEXTS = [["poem-001","poem","classical","靜夜思","李白","床前明月光，/疑是地上霜。/舉頭望明月，/低頭思故鄉。"],["poem-002","poem","classical","春曉","孟浩然","春眠不覺曉，/處處聞啼鳥。/夜來風雨聲，/花落知多少。"],["poem-003","poem","classical","登鸛雀樓","王之渙","白日依山盡，/黃河入海流。/欲窮千里目，/更上一層樓。"],["poem-004","poem","classical","相思","王維","紅豆生南國，/春來發幾枝。/願君多採擷{ㄒㄧㄝˊ}，/此物最相思。"],["poem-005","poem","classical","鹿柴","王維","空山不見人，/但聞人語響。/返景{ㄧㄥˇ}入深林，/復照青苔上。"],["poem-006","poem","classical","江雪","柳宗元","千山鳥飛絕，/萬徑人蹤滅。/孤舟蓑{ㄙㄨㄛ}笠翁，/獨釣寒江雪。"],["poem-007","poem","classical","回鄉偶書","賀知章","少小離家老大回，/鄉音無改鬢{ㄅㄧㄣˋ}毛衰{ㄘㄨㄟ}。/兒童相見不相識，/笑問客從何處來。"],["poem-008","poem","classical","清明","杜牧","清明時節雨紛紛，/路上行人欲斷魂。/借問酒家何處有，/牧童遙指杏花村。"],["poem-009","poem","classical","早發白帝城","李白","朝{ㄓㄠ}辭白帝彩雲間，/千里江陵一日還{ㄏㄨㄢˊ}。/兩岸猿聲啼不住，/輕舟已過萬重山。"],["poem-010","poem","classical","楓橋夜泊","張繼","月落烏啼霜滿天，/江楓漁火對愁眠。/姑蘇城外寒山寺，/夜半鐘聲到客船。"],["poem-011","poem","classical","夜雨寄北","李商隱","君問歸期未有期，/巴山夜雨漲秋池。/何當共剪西窗燭，/卻話巴山夜雨時。"],["poem-012","poem","classical","春望","杜甫","國破山河在，/城春草木深。/感時花濺淚，/恨別鳥驚心。/烽火連三月，/家書抵萬金。/白頭搔{ㄙㄠ}更短，/渾{ㄏㄨㄣˊ}欲不勝{ㄕㄥ}簪{ㄗㄢ}。"],["poem-013","poem","classical","如夢令","李清照","昨夜雨疏風驟{ㄗㄡˋ}，/濃睡不消殘酒。/試問捲簾人，/卻道海棠依舊。/知否？知否？/應是綠肥紅瘦。"],["poem-014","poem","classical","水調歌頭","蘇軾","明月幾時有？把酒問青天。/不知天上宮闕{ㄑㄩㄝˋ}，今夕是何年。/我欲乘風歸去，又恐瓊樓玉宇，高處不勝{ㄕㄥ}寒。/起舞弄清影，何似在人間。"],["poem-015","poem","classical","水調歌頭","蘇軾","轉朱閣，低綺{ㄑㄧˇ}戶，照無眠。/不應有恨，何事長向別時圓？/人有悲歡離合，月有陰晴圓缺，此事古難全。/但願人長久，千里共嬋{ㄔㄢˊ}娟。"],["poem-016","poem","modern","再別康橋","徐志摩","輕輕的我走了，/正如我輕輕的來；/我輕輕的招手，/作別西天的雲彩。"],["poem-017","poem","modern","再別康橋","徐志摩","那河畔的金柳，/是夕陽中的新娘；/波光裡的豔影，/在我的心頭蕩漾。"],["poem-018","poem","modern","再別康橋","徐志摩","軟泥上的青荇{ㄒㄧㄥˋ}，/油油的在水底招搖；/在康河的柔波裡，/我甘心做一條水草！"],["poem-019","poem","modern","再別康橋","徐志摩","那榆蔭下的一潭，/不是清泉，是天上虹；/揉碎在浮藻間，/沉澱著彩虹似的夢。"],["poem-020","poem","modern","再別康橋","徐志摩","尋夢？撐一支長篙{ㄍㄠ}，/向青草更青處漫溯{ㄙㄨˋ}；/滿載一船星輝，/在星輝斑斕{ㄌㄢˊ}裡放歌。"],["poem-021","poem","modern","再別康橋","徐志摩","但我不能放歌，/悄悄是別離的笙{ㄕㄥ}簫；/夏蟲也為我沉默，/沉默是今晚的康橋！"],["poem-022","poem","modern","再別康橋","徐志摩","悄悄的我走了，/正如我悄悄的來；/我揮一揮衣袖，/不帶走一片雲彩。"],["prose-001","prose","modern","匆匆","朱自清","燕子去了，有再來的時候；楊柳枯了，有再青的時候；桃花謝了，有再開的時候。"],["prose-002","prose","modern","匆匆","朱自清","但是，聰明的，你告訴我，我們的日子為什麼一去不復返呢？"],["prose-003","prose","modern","匆匆","朱自清","是有人偷了他們罷：那是誰？又藏在何處呢？是他們自己逃走了罷：現在又到了哪裡呢？"],["prose-004","prose","modern","匆匆","朱自清","我不知道他們給了我多少日子；但我的手確乎是漸漸空虛了。"],["prose-005","prose","modern","匆匆","朱自清","在默默裡算著，八千多日子已經從我手中溜去；像針尖上一滴水滴在大海裡，我的日子滴在時間的流裡，沒有聲音，也沒有影子。"],["prose-006","prose","modern","背影","朱自清","我與父親不相見已二年餘了，我最不能忘記的是他的背影。"],["prose-007","prose","modern","背影","朱自清","那年冬天，祖母死了，父親的差使也交卸了，正是禍不單行的日子。"],["prose-008","prose","modern","春","朱自清","盼望著，盼望著，東風來了，春天的腳步近了。"],["prose-009","prose","modern","春","朱自清","一切都像剛睡醒的樣子，欣欣然張開了眼。山朗潤起來了，水漲起來了，太陽的臉紅起來了。"],["prose-010","prose","modern","荷塘月色","朱自清","這幾天心裡頗不寧靜。今晚在院子裡坐著乘涼，忽然想起日日走過的荷塘，在這滿月的光裡，總該另有一番樣子吧。"],["prose-011","prose","classical","桃花源記","陶淵明","晉太元中，武陵人捕魚為業。緣溪行，忘路之遠近。"],["prose-012","prose","classical","桃花源記","陶淵明","忽逢桃花林，夾岸數百步，中無雜樹，芳草鮮美，落英繽紛。漁人甚異之。復前行，欲窮其林。"],["prose-013","prose","classical","陋室銘","劉禹錫","山不在高，有仙則名。水不在深，有龍則靈。斯是陋室，惟吾德馨{ㄒㄧㄣ}。苔痕上階綠，草色入簾青。"],["prose-014","prose","classical","陋室銘","劉禹錫","談笑有鴻儒，往來無白丁。可以調素琴，閱金經。無絲竹之亂耳，無案牘{ㄉㄨˊ}之勞形。南陽諸葛廬{ㄌㄨˊ}，西蜀子雲亭。孔子云：何陋之有？"],["prose-015","prose","classical","愛蓮說","周敦頤","水陸草木之花，可愛者甚蕃{ㄈㄢˊ}。晉陶淵明獨愛菊。自李唐來，世人甚愛牡丹。"],["prose-016","prose","classical","愛蓮說","周敦頤","予{ㄩˊ}獨愛蓮之出淤{ㄩ}泥而不染，濯{ㄓㄨㄛˊ}清漣{ㄌㄧㄢˊ}而不妖，中通外直，不蔓不枝，香遠益清，亭亭淨植，可遠觀而不可褻{ㄒㄧㄝˋ}玩焉。"],["twister-001","twister","folk","吃葡萄","民間","吃葡萄不吐葡萄皮，不吃葡萄倒吐葡萄皮。"],["twister-002","twister","folk","四和十","民間","四是四，十是十，十四是十四，四十是四十。/誰說十四是四十，就罰他十四；誰說四十是十四，就罰他四十。"],["twister-003","twister","folk","化肥","民間","化肥會揮發，黑化肥發灰，灰化肥發黑。/黑化肥發灰會揮發，灰化肥揮發會發黑。"],["twister-004","twister","folk","鳳凰","民間","粉紅牆上畫鳳凰，鳳凰畫在粉紅牆。/紅鳳凰、粉鳳凰，粉紅鳳凰、花鳳凰。"],["twister-005","twister","folk","扁擔和板凳","民間","扁擔長，板凳寬，扁擔沒有板凳寬，板凳沒有扁擔長。/扁擔綁在板凳上，板凳不讓扁擔綁在板凳上，扁擔偏要綁在板凳上。"],["twister-006","twister","folk","八百標兵","民間","八百標兵奔北坡，炮兵並排北邊跑。/炮兵怕把標兵碰，標兵怕碰炮兵炮。"],["twister-007","twister","folk","牛郎和劉娘","民間","牛郎戀劉娘，劉娘念牛郎。/牛郎年年戀劉娘，劉娘年年念牛郎。/郎戀娘來娘念郎，念娘戀娘念郎戀郎。"],["twister-008","twister","folk","媽媽騎馬","民間","媽媽騎馬，馬慢，媽媽罵馬。/妞妞騎牛，牛擰{ㄋㄧㄥˇ}，妞妞擰{ㄋㄧㄥˊ}牛。"],["twister-009","twister","folk","四輛大馬車","民間","門口有四輛四輪大馬車，你愛拉哪兩輛就拉哪兩輛。"],["twister-010","twister","folk","六十六歲的陸老頭","民間","六十六歲的陸老頭，蓋了六十六間樓，買了六十六簍{ㄌㄡˇ}油，堆在六十六間樓。/來了一陣狂風，吹倒了六十六間樓，翻倒了六十六簍{ㄌㄡˇ}油。"],["twister-011","twister","folk","藍布棉門簾","民間","出南門，往正南，有個麵鋪{ㄆㄨˋ}面衝{ㄔㄨㄥˋ}南，麵鋪{ㄆㄨˋ}門口掛著一個藍布棉門簾。"],["twister-012","twister","folk","司小四和史小世","民間","司小四和史小世，四月十四日十四時四十上集市。/司小四買了四十四斤四兩西紅柿，史小世買了十四斤四兩細蠶絲。"],["twister-013","twister","folk","白石塔","民間","白石塔，白石搭，白石搭白塔，白塔白石搭。/搭好白石塔，白塔白又滑。"],["twister-014","twister","folk","七","民間","天上七顆星，地上七塊冰，台上七盞燈，樹上七隻鶯，牆上七枚釘。"],["twister-015","twister","folk","和尚端湯","民間","和尚端湯上塔，塔滑湯灑湯燙塔。"],["twister-016","twister","folk","燉凍豆腐","民間","會燉我的燉凍豆腐，來燉我的燉凍豆腐；/不會燉我的燉凍豆腐，別胡燉亂燉，燉壞了我的燉凍豆腐。"]];
// Poems and prose from texts.tsv.
const LIT_NAMES = { "folk-twister": "繞口令", "classical-poem": "古典詩詞", "modern-poem": "現代詩", "classical-prose": "古文", "modern-prose": "現代散文" };
// In the text, "/" marks an original line break of a poem and {注音} after a character gives its reading.
// breaks holds the index of the character each new line starts with; readings maps character indexes to readings.
const LIT_PASSAGES = TEXTS.map(([id, kind, era, title, author, text]) => {
  const chars = [], breaks = new Set(), readings = new Map();
  for (const [, slash, ch, reading] of text.matchAll(/(\/)|([^{/])(?:\{([^}]*)\})?/gu)) {
    if (slash) { breaks.add(chars.length); continue; }
    if (reading) readings.set(chars.length, reading);
    chars.push(ch);
  }
  return { id, cat: `${era}-${kind}`, title, author, answers: [chars.join("")], breaks, readings };
});
const PASSAGE_BY_ID = new Map(LIT_PASSAGES.map((x) => [x.id, x]));
const PUNCTUATION = /^[，。、；：？！」』）…—]$/;
const STORE_KEY = "zhuyin-typing-sheet-v1";
const $ = (id) => document.getElementById(id);

let history = [];
let prefs = { set: "all", order: "seq", readings: true };
try { const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (saved) { history = saved.history || []; Object.assign(prefs, saved.prefs || {}); } } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ history, prefs })); } catch (e) {} }

// Sets of sentences.
const SETS = [["all", `全部（${LIT_PASSAGES.length} 段）`]];
for (const kind of Object.keys(LIT_NAMES)) SETS.push(["lit:" + kind, `${LIT_NAMES[kind]}（${LIT_PASSAGES.filter((x) => x.cat === kind).length} 段）`]);
for (const [v, t] of SETS) { const o = document.createElement("option"); o.value = v; o.textContent = t; $("set").appendChild(o); }

function pool() {
  const s = prefs.set;
  if (s.startsWith("lit:")) return LIT_PASSAGES.filter((x) => x.cat === s.slice(4));
  return LIT_PASSAGES;
}

// Scoring: character edit distance against the original.
const norm = (s) => Array.from(s);
function align(a, b) { // a: answer chars, b: typed chars; returns {dist, ops}
  const n = a.length, m = b.length, d = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 0; i <= n; i++) d[i][0] = i;
  for (let j = 0; j <= m; j++) d[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  const ops = []; let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) { ops.push(a[i - 1] === b[j - 1] ? ["ok", i - 1, j - 1] : ["sub", i - 1, j - 1]); i--; j--; }
    else if (j > 0 && d[i][j] === d[i][j - 1] + 1) { ops.push(["ins", -1, j - 1]); j--; }
    else { ops.push(["del", i - 1, -1]); i--; }
  }
  return { dist: d[n][m], ops: ops.reverse() };
}
function grade(sentence, typed) {
  const t = norm(typed.trim());
  let best = null;
  sentence.answers.forEach((ans, k) => {
    const r = align(norm(ans), t);
    if (!best || r.dist < best.dist) best = { ...r, answer: ans, index: k };
  });
  const len = Array.from(sentence.answers[0]).length;
  return { ...best, errors: Math.min(best.dist, len), len };
}
// Grades text typed so far against the beginning of the answer, so mistakes show up before the sentence is finished.
function gradePrefix(sentence, typed) {
  const t = norm(typed.trim());
  let best = null;
  for (const ans of sentence.answers) {
    const a = norm(ans), lo = Math.min(a.length, Math.max(0, t.length - 3)), hi = Math.min(a.length, t.length + 3);
    for (let k = lo; k <= hi; k++) {
      const r = align(a.slice(0, k), t), gap = Math.abs(k - t.length);
      if (!best || r.dist < best.dist || (r.dist === best.dist && gap < best.gap)) best = { ...r, gap, answer: ans, done: k };
    }
  }
  return best;
}

// Rendering.
let current = null, startedAt = null, graded = false, seqIndex = 0;
function cell(ch, cls, fix) {
  const c = document.createElement("div");
  c.className = "cell" + (cls ? " " + cls : "");
  c.textContent = ch;
  if (fix) { const f = document.createElement("span"); f.className = "fix"; f.textContent = fix; c.appendChild(f); }
  return c;
}
function renderMeta() {
  $("sid").textContent = current.id;
  $("scat").textContent = `${current.title}・${current.author}`;
  const p = pool(); $("progress").textContent = prefs.order === "seq" ? `第 ${p.indexOf(current) + 1}／${p.length} 題` : `${p.length} 題中隨機`;
  $("alts").textContent = current.answers.length > 1 ? "也接受：" + current.answers.slice(1).join("、") : "";
}
// Draws original/typed column pairs. Without a final result, grades the text typed so far and leaves the rest of the original blank below.
// Draws original/typed column pairs. Without a final result, grades the committed text, shows the composition still being typed after it, and moves the input to the caret.
function renderPairs(text, result, preedit = "", caretAt = Array.from(preedit).length) {
  const box = $("pairs"); box.replaceChildren();
  let unit = null, unitClosed = false;
  const phrases = /-(poem|twister)$/.test(current.cat);
  // ai is the column's index in the original, or -1 for a column outside it.
  const col = (top, bottom, cls, fix, ai = -1) => {
    const c = document.createElement("div"); c.className = "col";
    const reading = current.readings.get(ai), t = cell(top, reading ? "has-reading" : "");
    if (reading) { const r = document.createElement("span"); r.className = "reading"; r.textContent = reading; t.appendChild(r); }
    const b = cell(bottom, "typed" + (cls ? " " + cls : ""), fix); c.append(t, b);
    if (current.breaks.has(ai)) { const br = document.createElement("div"); br.className = "br"; box.appendChild(br); unit = null; }
    const punct = PUNCTUATION.test(top);
    if (!unit || (phrases ? unitClosed && !punct : !punct)) { unit = document.createElement("div"); unit.className = "unit"; box.appendChild(unit); }
    unit.appendChild(c);
    unitClosed = punct;
    return b;
  };
  let r = null, rest = Array.from(current.answers[0]), restStart = 0;
  if (text.trim()) {
    r = result || gradePrefix(current, text);
    const typedChars = Array.from(text.trim()), ansChars = Array.from(r.answer);
    for (const [op, ai, ti] of r.ops) {
      if (op === "ok") col(ansChars[ai], typedChars[ti], "ok", "", ai);
      else if (op === "sub") col(ansChars[ai], typedChars[ti], "wrong", "", ai);
      else if (op === "ins") col("", typedChars[ti], "wrong", "刪");
      else col(ansChars[ai], "", "missing", "", ai);
    }
    rest = ansChars.slice(r.done); restStart = r.done;
  }
  if (result) return r;
  const pre = Array.from(preedit);
  let caret = null;
  for (let i = 0; i < Math.max(rest.length, pre.length + 1); i++) {
    const b = col(rest[i] || "", pre[i] || "", i < pre.length ? "composing" : "", "", i < rest.length ? restStart + i : -1);
    if (i === caretAt) caret = b;
  }
  caret.classList.add("caret");
  placeInput(caret);
  return r;
}
function placeInput(target) {
  const s = $("sheet").getBoundingClientRect(), c = target.getBoundingClientRect();
  typing.style.left = `${c.left - s.left}px`;
  typing.style.top = `${c.top - s.top}px`;
}
// Reopens a submitted answer for editing: drops its record and deletes the last character, as Backspace would have.
let submitted = "";
function reopen() {
  if (history[0] && history[0].id === current.id) { history.shift(); save(); renderStats(); }
  graded = false;
  typing.value = committed = Array.from(submitted).slice(0, -1).join("");
  renderLive();
}
// Text the input method has committed; the rest of the input's value is the composition still being typed.
let committed = "";
// Safari does not set isComposing on keydown, so track the composition from its events.
let composing = false;
function renderLive() {
  if (graded) return;
  const value = typing.value;
  const preedit = value.startsWith(committed) ? value.slice(committed.length) : "";
  // While composing, the input's caret is the input method's cursor, which can move back within the composition to pick earlier characters.
  const caretAt = composing ? Math.max(0, Math.min(Array.from(preedit).length, Array.from(value.slice(committed.length, typing.selectionStart)).length)) : undefined;
  const r = renderPairs(committed, null, preedit, caretAt);
  if (!r) return showStartHint();
  const wrong = r.ops.filter(([op]) => op !== "ok").length;
  const v = $("verdict"); v.replaceChildren();
  const info = document.createElement("span"); info.className = "num"; info.style.color = wrong ? "var(--red)" : "var(--ok)";
  info.textContent = wrong ? `目前錯 ${wrong} 字` : "目前全對"; v.appendChild(info);
  const tip = document.createElement("span"); tip.className = "hint"; tip.textContent = `已打 ${r.done}／${Array.from(r.answer).length} 字，打完按 Enter 交卷`; v.appendChild(tip);
}
function showStartHint() { $("verdict").innerHTML = '<span class="hint">每次按 Enter 送出選字就會立刻批改；整句打完再按一次 Enter 交卷。Esc 跳過這題。</span>'; }
function pick(step) {
  const p = pool(); if (!p.length) return;
  if (prefs.order === "rand") { let n; do { n = p[Math.floor(Math.random() * p.length)]; } while (p.length > 1 && n === current); current = n; }
  else { seqIndex = (p.indexOf(current) + step + p.length) % p.length; if (!current || !p.includes(current)) seqIndex = 0; current = p[seqIndex]; }
  startedAt = null; graded = false;
  $("typing").value = ""; committed = ""; renderMeta(); renderPairs("", null);
  showStartHint();
  $("typing").focus();
}
function submit() {
  const text = $("typing").value;
  if (!text.trim() || graded) return;
  const ms = startedAt ? Date.now() - startedAt : 0;
  const r = grade(current, text);
  graded = true;
  renderPairs(text, r);
  const chars = Array.from(text.trim()).length;
  const cpm = ms > 0 ? Math.round(chars / (ms / 60000)) : null;
  const ok = r.errors === 0;
  const v = $("verdict"); v.replaceChildren();
  const stamp = document.createElement("span"); stamp.className = "stamp" + (ok ? " good" : ""); stamp.textContent = ok ? "全對" : `錯 ${r.errors} 字`; v.appendChild(stamp);
  const info = document.createElement("span"); info.className = "num"; info.textContent = `逐字 ${(100 * (r.len - r.errors) / r.len).toFixed(1)}%` + (cpm ? `　${cpm} 字／分　${(ms / 1000).toFixed(1)} 秒` : ""); v.appendChild(info);
  const tip = document.createElement("span"); tip.className = "hint"; tip.textContent = "按 Enter 或「下一題」繼續，按 Backspace 回去改"; v.appendChild(tip);
  submitted = text;
  history.unshift({ id: current.id, output: text.trim(), ok, errors: r.errors, len: r.len, ms, chars, at: Date.now() });
  save(); renderStats();
}

// Stats and history.
function renderStats() {
  const tbody = $("stats").querySelector("tbody"); tbody.replaceChildren();
  const groups = new Map(Object.keys(LIT_NAMES).map((k) => [LIT_NAMES[k], []]));
  for (const h of history) { const p = PASSAGE_BY_ID.get(h.id); if (p) groups.get(LIT_NAMES[p.cat]).push(h); }
  const answered = [...groups.values()].flat();
  if (!answered.length) { const tr = document.createElement("tr"); const td = document.createElement("td"); td.colSpan = 5; td.className = "empty"; td.textContent = "還沒有作答。開始打第一題吧。"; tr.appendChild(td); tbody.appendChild(tr); }
  else for (const [name, rows] of [...groups, ["合計", answered]]) {
    if (!rows.length) continue;
    const n = rows.length, ok = rows.filter((r) => r.ok).length;
    const len = rows.reduce((s, r) => s + r.len, 0), err = rows.reduce((s, r) => s + r.errors, 0);
    const speeds = rows.filter((r) => r.ms > 0).map((r) => r.chars / (r.ms / 60000)).sort((a, b) => a - b);
    const med = speeds.length ? Math.round(speeds[Math.floor(speeds.length / 2)]) : "—";
    const tr = document.createElement("tr");
    [name, n, (100 * ok / n).toFixed(1) + "%", (100 * (len - err) / len).toFixed(1) + "%", med].forEach((v, i) => { const td = document.createElement("td"); td.textContent = v; if (i) td.className = "num"; tr.appendChild(td); });
    tbody.appendChild(tr);
  }
  const hist = $("history"); hist.replaceChildren();
  if (!history.length) { const p = document.createElement("div"); p.className = "empty"; p.textContent = "作答後會列在這裡。"; hist.appendChild(p); }
  for (const h of history.slice(0, 40)) {
    const row = document.createElement("div"); row.className = "hrow";
    const out = document.createElement("span"); out.className = "out" + (h.ok ? "" : " bad"); out.textContent = h.output;
    const res = document.createElement("span"); res.className = "num"; res.style.color = h.ok ? "var(--ok)" : "var(--red)"; res.textContent = h.ok ? "對" : `錯 ${h.errors}`;
    const sub = document.createElement("span"); sub.className = "sub"; const p = PASSAGE_BY_ID.get(h.id); sub.textContent = p ? `${p.title}・${p.author}` : h.id;
    row.append(out, res, sub); hist.appendChild(row);
  }
}

// Events.
const typing = $("typing");
typing.addEventListener("compositionstart", () => { composing = true; if (!startedAt && !graded) startedAt = Date.now(); });
// Grade whenever text is committed: when the input method's composition ends (Enter picks the candidates) or on plain input such as deletions.
typing.addEventListener("input", (e) => { if (graded) return; if (!startedAt) startedAt = Date.now(); if (!e.isComposing) committed = typing.value; renderLive(); });
typing.addEventListener("compositionend", () => setTimeout(() => { composing = false; committed = typing.value; renderLive(); }, 0));
$("pairs").addEventListener("click", () => typing.focus());
document.addEventListener("selectionchange", () => { if (composing && document.activeElement === typing) renderLive(); });
window.addEventListener("resize", () => { if (!graded) renderLive(); });
// The squares only show a caret at the end, so keep the input's caret there too; otherwise Backspace could delete a character in the middle.
const caretToEnd = () => { if (composing) return; const n = typing.value.length; if (typing.selectionStart !== n || typing.selectionEnd !== n) typing.setSelectionRange(n, n); };
typing.addEventListener("focus", caretToEnd);
typing.addEventListener("pointerup", caretToEnd);
typing.addEventListener("keydown", (e) => {
  // Keys the input method handles (moving its cursor, picking candidates, the Enter that commits) are left alone.
  if (composing || e.isComposing || e.keyCode === 229) return;
  caretToEnd();
  if (graded && e.key === "Backspace") { e.preventDefault(); reopen(); return; }
  if (e.key === "Enter") { e.preventDefault(); graded ? pick(1) : submit(); }
  else if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) e.preventDefault();
  else if (e.key === "Escape") { e.preventDefault(); pick(1); }
});
$("next").addEventListener("click", () => { if (!graded && typing.value.trim()) submit(); else pick(1); });
$("skip").addEventListener("click", () => pick(1));
$("set").addEventListener("change", (e) => { prefs.set = e.target.value; save(); current = null; pick(0); });
$("order").addEventListener("change", (e) => { prefs.order = e.target.value; save(); });
$("readings").addEventListener("change", (e) => { prefs.readings = e.target.checked; save(); $("sheet").classList.toggle("no-readings", !prefs.readings); typing.focus(); });
let clearArmed = null;
$("clear").addEventListener("click", () => {
  if (!clearArmed) { $("clear").textContent = "再按一次確認清除"; clearArmed = setTimeout(() => { clearArmed = null; $("clear").textContent = "清除所有紀錄"; }, 3000); return; }
  clearTimeout(clearArmed); clearArmed = null; history = []; save(); renderStats(); $("clear").textContent = "已清除";
  setTimeout(() => ($("clear").textContent = "清除所有紀錄"), 1500);
});

// Start.
if (!SETS.some(([v]) => v === prefs.set)) prefs.set = "all";
$("set").value = prefs.set; $("order").value = prefs.order;
$("readings").checked = prefs.readings; $("sheet").classList.toggle("no-readings", !prefs.readings);
current = null; pick(0); renderStats();
</script>
